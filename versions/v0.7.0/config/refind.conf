# BatoSteam boot menu - rEFInd configuration
# Author: Dan Lee
# Version: 0.7.0
#
# Placeholders in @...@ are filled in by lib/refind.sh at install time.

timeout @TIMEOUT@
default_selection "@DEFAULT@"
use_nvram false
resolution max

# BatoSteam "split screen" graphical theme (artwork: tools/make-theme.py)
banner          themes/batosteam/background.png
banner_scale    fillscreen
big_icon_size   384
small_icon_size 64
selection_big   themes/batosteam/selection_big.png
selection_small themes/batosteam/selection_small.png
font            themes/batosteam/ubuntu-mono-24.png
# Hide rEFInd's own hint text and drive badges - the background has its own hints
hideui hints,badges
showtools reboot, shutdown, firmware
# Only show the entries below - do not auto-scan for other loaders
scanfor manual,external

menuentry "Batocera" {
    icon     /EFI/refind/icons/@BATO_ICON@
    volume   @BATO_PARTUUID@
    loader   /EFI/batocera/grubx64.efi
    @BATO_DISABLED@
}

menuentry "SteamOS" {
    icon     /EFI/refind/icons/@STEAM_ICON@
    volume   @STEAM_PARTUUID@
    loader   /efi/steamos/steamcl.efi
    @STEAM_DISABLED@
}
