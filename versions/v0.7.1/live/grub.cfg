# BatoSteam Live - boot menu of the USB drive itself
# Author: Dan Lee
# Version: 0.7.1
set timeout=3
set default=0
search --no-floppy --set=root --file /live/batosteam.id
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "BatoSteam Installer" {
    linux  /live/vmlinuz boot=live live-media-path=/live quiet loglevel=3 systemd.show_status=0
    initrd /live/initrd.img
}
menuentry "BatoSteam Installer (safe graphics - use if the screen stays black)" {
    linux  /live/vmlinuz boot=live live-media-path=/live nomodeset
    initrd /live/initrd.img
}
menuentry "Firmware / BIOS settings" {
    fwsetup
}
